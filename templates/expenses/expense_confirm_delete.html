{% extends "base.html" %}
{% block title %}Delete expense · SpendWise{% endblock %}
{% block content %}
<div class="form-page"><section class="panel confirm-panel"><div class="delete-symbol">!</div><h1>Delete this expense?</h1><p class="muted">You’re about to delete <strong>{{ expense.title }}</strong> for <strong>₹{{ expense.amount|floatformat:2 }}</strong>. This cannot be undone.</p>
<form method="post">{% csrf_token %}<div class="form-actions"><button class="button danger" type="submit">Yes, delete</button><a class="button secondary" href="{% url 'expense_list' %}">Keep expense</a></div></form></section></div>
{% endblock %}
